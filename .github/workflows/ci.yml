name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build image
        run: docker build -t docutrust:ci-${{ github.sha }} .

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run custom SQLi rule (blocking gate, Project 1 scope)
        run: |
          pip install semgrep --break-system-packages
          semgrep --config custom-rules/sql-string-concat.yaml --error .

      - name: Run full default ruleset (informational only, not gated)
        if: always()
        run: |
          semgrep --config auto . || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (no allowlist, catches known-placeholder-shaped secrets too)
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: gitleaks-custom.toml

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (blocking gate, Project 2 scope)
        run: npm audit --audit-level=high

  scorecard-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.json
          results_format: json
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce minimum score threshold
        run: |
          SCORE=$(jq '.score' scorecard-results.json)
          echo "Scorecard overall score: $SCORE"
          MIN_SCORE=5.0
          if (( $(echo "$SCORE < $MIN_SCORE" | bc -l) )); then
            echo "Scorecard score $SCORE is below minimum threshold $MIN_SCORE — failing build."
            exit 1
          fi

  provenance:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC token for Fulcio (keyless) and attestations
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image repository name
        id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.repo }}:${{ github.sha }}

      - name: Attest build provenance (Project 4)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.image.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # ---------- Project 5 ----------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v3.1.4'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign image (keyless, by digest)
        run: |
          cosign version
          cosign sign --yes ${{ steps.image.outputs.repo }}@${{ steps.push.outputs.digest }}

      - name: Generate SBOM from the built image
        run: |
          syft version
          syft ${{ steps.image.outputs.repo }}@${{ steps.push.outputs.digest }} -o spdx-json=sbom.spdx.json
          grep -c '"name"' sbom.spdx.json

      - name: Attest SBOM (keyless)
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            ${{ steps.image.outputs.repo }}@${{ steps.push.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

      - name: Print digest for the record
        run: echo "IMAGE DIGEST ${{ steps.push.outputs.digest }}"

  # Every stage below this line is a deliberate placeholder. This is the
  # baseline pipeline the shared DocuTrust codebase ships with, each
  # DevSecOps project in this track adds its own real stage here, SAST
  # and secrets scanning in Project 1, SCA and Scorecard in Project 2,
  # signing and provenance in Projects 4-5, and so on. Wiring a stage
  # in before its project is reached would pre-solve the work.
