name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build image
        run: docker build -t docutrust:ci-${{ github.sha }} .

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run custom SQLi rule (blocking gate, Project 1 scope)
        run: |
          pip install semgrep --break-system-packages
          semgrep --config custom-rules/sql-string-concat.yaml --error .

      - name: Run full default ruleset (informational only, not gated)
        if: always()
        run: |
          semgrep --config auto . || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (no allowlist, catches known-placeholder-shaped secrets too)
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: gitleaks-custom.toml

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (blocking gate, Project 2 scope)
        run: npm audit --audit-level=high

  scorecard-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.json
          results_format: json
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce minimum score threshold
        run: |
          SCORE=$(jq '.score' scorecard-results.json)
          echo "Scorecard overall score: $SCORE"
          MIN_SCORE=5.0
          if (( $(echo "$SCORE < $MIN_SCORE" | bc -l) )); then
            echo "Scorecard score $SCORE is below minimum threshold $MIN_SCORE — failing build."
            exit 1
          fi

  provenance:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required — lets the job request a short-lived OIDC token
      attestations: write    # required — lets the job publish the attestation
      packages: write        # required — pushing to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image repository name
        id: image
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.repo }}:${{ github.sha }}

      - name: Attempt to exfiltrate/reuse the OIDC token
        run: |
          echo "Attempting to fetch a raw OIDC token directly..."
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" -o token_response.json
          cat token_response.json
          echo "---"
          echo "Attempting to reuse this token against Fulcio directly, outside the attest action..."
          curl -s -X POST https://fulcio.sigstore.dev/api/v2/signingCert \
            -H "Content-Type: application/json" \
            -d '{"credentials":{"oidcIdentityToken":"'"$(jq -r .value token_response.json)"'"}}' \
            -o fulcio_response.json || true
          cat fulcio_response.json

      - name: Generate ephemeral keypair
        run: |
          openssl ecparam -genkey -name prime256v1 -noout -out ephemeral-key.pem
          openssl ec -in ephemeral-key.pem -pubout -out ephemeral-pub.pem
          # DER-encode the public key, base64 it for the Fulcio request
          openssl ec -in ephemeral-key.pem -pubout -outform DER -out ephemeral-pub.der
          base64 -w0 ephemeral-pub.der > ephemeral-pub.b64

      - name: Decode token and extract subject claim (fixed)
        run: |
          TOKEN=$(cat oidc-token.txt)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . > token-claims.json || \
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq . > token-claims.json
          jq -j .sub token-claims.json > subject.txt   # -j = raw output, no trailing newline

      - name: Sign the subject claim
        run: |
          openssl dgst -sha256 -sign ephemeral-key.pem -out signature.der subject.txt
          base64 -w0 signature.der > signature.b64

      - name: Retry Fulcio request with proof of possession
        run: |
          TOKEN=$(cat oidc-token.txt)
          PUBKEY=$(cat ephemeral-pub.b64)
          SIG=$(cat signature.b64)
          curl -s -X POST https://fulcio.sigstore.dev/api/v2/signingCert \
            -H "Content-Type: application/json" \
            -d "{\"credentials\":{\"oidcIdentityToken\":\"$TOKEN\"},\"publicKeyRequest\":{\"publicKey\":{\"algorithm\":\"PKIX_ECDSA_P256_SHA_256\",\"content\":\"$PUBKEY\"},\"proofOfPossession\":\"$SIG\"}}" \
            -o fulcio_retry_response.json
          cat fulcio_retry_response.json

      - name: Retry Fulcio request with PEM-format public key
        run: |
          TOKEN=$(cat oidc-token.txt)
          SIG=$(cat signature.b64)
          # Read the PEM file and JSON-escape its newlines
          PUBKEY_PEM=$(python3 -c "import json,sys; print(json.dumps(open('ephemeral-pub.pem').read()))")
          curl -s -X POST https://fulcio.sigstore.dev/api/v2/signingCert \
            -H "Content-Type: application/json" \
            -d "{\"credentials\":{\"oidcIdentityToken\":\"$TOKEN\"},\"publicKeyRequest\":{\"publicKey\":{\"algorithm\":\"PKIX_ECDSA_P256_SHA_256\",\"content\":$PUBKEY_PEM},\"proofOfPossession\":\"$SIG\"}}" \
            -o fulcio_retry_response.json
          cat fulcio_retry_response.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.image.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      
      - name: Attempt to read the OIDC token request context
        run: |
          echo "Token URL var present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "Token var present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"

  # Every stage below this line is a deliberate placeholder. This is the
  # baseline pipeline the shared DocuTrust codebase ships with, each
  # DevSecOps project in this track adds its own real stage here, SAST
  # and secrets scanning in Project 1, SCA and Scorecard in Project 2,
  # signing and provenance in Projects 4-5, and so on. Wiring a stage
  # in before its project is reached would pre-solve the work.
